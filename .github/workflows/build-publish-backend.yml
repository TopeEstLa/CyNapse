name: Build backend application

on:
  push:
    branches: [ "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@af1da67850ed9a4cedd57bfd976089dd991e2582 # v4.0.0

      - name: Make gradlew executable
        run: chmod +x gradlew
        working-directory: ./backend

      - name: Build with Gradle Wrapper
        run: ./gradlew build
        working-directory: ./backend

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Flac-Backend
          path: backend/build/libs/

      - name: Login to docker hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      - name: Build and push Docker image
        run: |
          docker build backend -t ${{ secrets.DOCKERHUB_USERNAME }}/flac-backend:${GITHUB_SHA}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flac-backend:${GITHUB_SHA}
          docker tag ${{ secrets.DOCKERHUB_USERNAME }}/flac-backend:${GITHUB_SHA} ${{ secrets.DOCKERHUB_USERNAME }}/flac-backend:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/flac-backend:latest